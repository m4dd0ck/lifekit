[project]
name = "lifekit"
version = "0.1.0"
description = "Local-first personal management: habits, journal, goals. Append-only event log in DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "duckdb>=1.1.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "structlog>=24.4.0",
    "typer>=0.15.0",
]

[project.scripts]
lk = "lifekit.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifekit"]
